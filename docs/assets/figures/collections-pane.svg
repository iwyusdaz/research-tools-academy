<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="f-collections-t f-collections-d">
<title id="f-collections-t">Schematic: the Zotero window with the collections pane on the left</title>
<desc id="f-collections-d">The Zotero window has three columns. Left: My Library with collections Thesis chapter 2 and Coursework, plus Duplicate Items. Middle: the items list for the selected collection. Right: the info panel of the selected item.</desc>
<rect x="0" y="0" width="720" height="320" fill="#ffffff"></rect>
<rect x="30" y="40" width="220" height="230" rx="6" fill="#f4f7fa" stroke="#5a6b7b" stroke-width="1.5"></rect>
<rect x="260" y="40" width="220" height="230" rx="6" fill="#f4f7fa" stroke="#5a6b7b" stroke-width="1.5"></rect>
<rect x="490" y="40" width="200" height="230" rx="6" fill="#f4f7fa" stroke="#5a6b7b" stroke-width="1.5"></rect>
<text x="40" y="62" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="start">My Library</text>
<text x="50" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2d3d" text-anchor="start">Thesis chapter 2</text>
<text x="50" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2d3d" text-anchor="start">Coursework</text>
<text x="50" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2d3d" text-anchor="start">Duplicate Items</text>
<text x="270" y="62" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="start">Items</text>
<text x="280" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#44566b" text-anchor="start">Nguyen 2024, wetland…</text>
<text x="280" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#44566b" text-anchor="start">Okafor 2023, policy…</text>
<text x="280" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#44566b" text-anchor="start">Silva 2025, carbon…</text>
<text x="500" y="62" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="start">Info</text>
<text x="500" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#44566b" text-anchor="start">Title / Author / Year</text>
<text x="500" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#44566b" text-anchor="start">Abstract · Attachments</text>
<line x1="45" y1="285" x2="55" y2="272" stroke="#1f2d3d" stroke-width="1.2"></line>
<circle cx="45" cy="285" r="11" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"></circle>
<text x="45" y="289.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">1</text>
<line x1="270" y1="285" x2="285" y2="272" stroke="#1f2d3d" stroke-width="1.2"></line>
