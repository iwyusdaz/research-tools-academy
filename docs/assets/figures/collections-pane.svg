<text x="270" y="289.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">2</text>
<line x1="490" y1="285" x2="505" y2="272" stroke="#1f2d3d" stroke-width="1.2"></line>
<circle cx="490" cy="285" r="11" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"></circle>
<text x="490" y="289.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">3</text>
<text x="30" y="306" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#44566b" text-anchor="start" font-style="italic">1. Collections (left)   2. Items list (middle)   3. Item details (right)</text>
