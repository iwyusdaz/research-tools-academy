<rect x="228" y="30" width="14" height="14" fill="url(#hatchBoth)" stroke="#7fa6c9"></rect>
<text x="247" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2d3d">Both (documented behavior, avoidable)</text>
